<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="NO_SIGNAL placeholder">
  <!-- img/placeholder.svg — terminal-style NO_SIGNAL card shown when a team thumbnail is missing -->
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0b1a0b"/>
      <stop offset="1" stop-color="#030503"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#0f5a1f"/><stop offset="0.5" stop-color="#39ff14"/><stop offset="1" stop-color="#0f5a1f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#vig)"/>
  <g stroke="#0f5a1f" stroke-width="1" opacity="0.55">
    <path d="M0 50H640M0 100H640M0 150H640M0 200H640M0 250H640M0 300H640M0 350H640"/>
    <path d="M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400"/>
  </g>
  <rect x="24" y="24" width="592" height="352" fill="none" stroke="#39ff14" stroke-width="2" stroke-dasharray="14 8" opacity="0.7"/>
  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" fill="#39ff14">
    <text x="40" y="60" font-size="14" fill="#5e8f62">┌─┤ CAM_01 ├───────────────────────────────┐</text>
    <text x="320" y="200" font-size="46" font-weight="bold" text-anchor="middle" letter-spacing="6">NO_SIGNAL</text>
    <text x="320" y="238" font-size="16" text-anchor="middle" fill="#b8ffb0">awaiting upload · drop image into img/</text>
    <text x="320" y="300" font-size="14" text-anchor="middle" fill="#ffb000">[WARN] thumbnail not found on disk</text>
    <text x="40" y="360" font-size="14" fill="#5e8f62">└──────────────────────────────── 0x0000 ──┘</text>
  </g>
  <rect x="120" y="262" width="400" height="6" fill="#0f5a1f"/>
  <rect x="120" y="262" width="230" height="6" fill="url(#bar)"/>
  <rect width="640" height="400" fill="url(#scan)"/>
</svg>
