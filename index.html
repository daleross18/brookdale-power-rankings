<!DOCTYPE html>
<!--
  index.html — The Brookdale League · 2026 Preseason Power Rankings
  Single-page shell for a crisp black-and-green terminal site. No build step, no framework.
  Load order: data.js → writeups.js → history.js → sim.js → app.js → audio/playlist.js → player.js
  (all relative paths so the site works from file:// and from a GitHub Pages sub-path).
  Views are hash-routed by app.js and rendered into #app:
    #/            file list (ls -la of the ten .rank files + SEASON_SIM.exe + LEAGUE_INTEL.log)
    #/t/<slug>    one team file (cat 01_HOES_MAD.rank)
    #/sim         SEASON_SIM.exe mini-game (./season_sim.exe — body from sim.js)
    #/intel       league intel (cat LEAGUE_INTEL.log)
  Layers: #matrix (canvas rain, behind) · #app (content) · #crt (scanlines/vignette, above) · #statusbar (tmux bar)
          · .adeck (player.js audio deck, fixed bottom-right above the status bar)
-->
